      <rect x="308"  y="44" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="352"  y="44" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="396"  y="44" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>

      <rect x="0"    y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="44"   y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="88"   y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="132"  y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="176"  y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="220"  y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="264"  y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="308"  y="88" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
