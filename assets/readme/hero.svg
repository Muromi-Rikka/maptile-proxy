      <rect x="44"   y="44" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="88"   y="44" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="132"  y="44" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="176"  y="44" width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
