<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Maptile Proxy — GCJ-02 Coordinate Transforming Tile Cache Server</title>
  <desc id="hero-desc">A tile proxy server that automatically transforms WGS84 coordinates to GCJ-02 for Chinese map services, with LRU memory cache and S3 persistent storage.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A5F" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="#0B1628"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>

  <!-- ═══ Left: Title ═══ -->
  <g transform="translate(56, 0)">
    <text y="88" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">TILE PROXY SERVER</text>
    <text y="148" fill="#E8EDF4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="50" font-weight="700" letter-spacing="-1">Maptile Proxy</text>
    <text y="190" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="400">GCJ-02 坐标纠偏 + 多级缓存代理</text>

    <!-- Metrics -->
    <g transform="translate(0, 232)">
      <circle cx="8" cy="8" r="4" fill="#10B981"/>
      <text x="20" y="13" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">3 级缓存架构</text>

      <circle cx="148" cy="8" r="4" fill="#10B981"/>
      <text x="160" y="13" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">WGS84 → GCJ-02 自动纠偏</text>

      <circle cx="378" cy="8" r="4" fill="#10B981"/>
      <text x="390" y="13" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Docker 一键部署</text>
    </g>

    <!-- Tech stack -->
    <text y="290" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Hono · OpenLayers · S3/MinIO · TypeScript</text>
  </g>

  <!-- ═══ Right: Tile Grid ═══ -->
  <g transform="translate(660, 52)">
    <!-- 10×10 Tile Grid -->
    <g>
      <!-- Grid tiles (empty) -->
      <rect x="0"    y="0"  width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="44"   y="0"  width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="88"   y="0"  width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="132"  y="0"  width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="176"  y="0"  width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="220"  y="0"  width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
      <rect x="264"  y="0"  width="38" height="38" rx="3" fill="#0F2744" stroke="#1E3A5F" stroke-width="1.2"/>
